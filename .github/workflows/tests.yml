name: PySpark Unit Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SPARK_LOCAL_IP: 127.0.0.1
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-etl.txt
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: python -m pip install -r requirements-etl.txt
      - name: Test transformations
        run: python -m pytest -q
